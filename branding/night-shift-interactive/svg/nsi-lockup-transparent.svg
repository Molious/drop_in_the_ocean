<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1384 480" width="1384" height="480" role="img" aria-label="Night Shift Interactive">
<title>Night Shift Interactive</title>
<defs>
  <linearGradient id="nsl-aqua" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3FF2E3"/><stop offset="1" stop-color="#14B4D9"/>
  </linearGradient>
  <linearGradient id="nsl-ring" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#5B21D6"/><stop offset="1" stop-color="#9B5CFF"/>
  </linearGradient>
  <filter id="nsl-glow-aqua" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="nsl-glow-purple" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <mask id="nsl-crescent">
    <circle cx="252" cy="264" r="134" fill="#fff"/>
    <circle cx="314" cy="216" r="116" fill="#000"/>
  </mask>
</defs>

<g transform="translate(60,60) scale(0.703125)"><g>
  <path d="M 349.9 79.4 A 200 200 0 1 0 441.4 181.1" fill="none"
        stroke="url(#nsl-ring)" stroke-width="16" stroke-linecap="round"
        filter="url(#nsl-glow-purple)"/>
  <g filter="url(#nsl-glow-aqua)">
    <rect x="0" y="0" width="512" height="512" fill="url(#nsl-aqua)"
          mask="url(#nsl-crescent)"/>
  </g>
  <path d="M396 92 L404 120 L432 128 L404 136 L396 164 L388 136 L360 128 L388 120 Z"
        fill="#F1EDFF" filter="url(#nsl-glow-purple)"/>
</g></g>
